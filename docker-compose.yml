services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health-copilot-backend
    restart: unless-stopped
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    ports:
      - "8000:8000"
    networks:
      copilot-network:
        aliases:
          - backend
          - health-copilot-backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: health-copilot-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      copilot-network:
        aliases:
          - frontend
          - health-copilot-frontend
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: health-copilot-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - copilot-network
    depends_on:
      - frontend
      - backend

networks:
  copilot-network:
    driver: bridge
